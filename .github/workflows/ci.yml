name: CI

# One job per app, so a red job names the surface that broke.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels the in-flight run; `main` keeps its full history.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  web:
    name: Web · lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # `ci`: the lockfile is the contract.
      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test config paths
        run: npm run test:config

      # `tsc -b && vite build`: the type check is part of the build.
      - name: Typecheck and build
        run: npm run build

      - name: Install presentation test browser
        run: npx playwright install --with-deps chromium

      - name: Test freshness policy feedback
        run: npx playwright test --config playwright.freshness.config.ts --workers=1

      - name: Test Auto routing badge geometry
        run: npx playwright test --config playwright.auto-badge.config.ts --workers=1

      - name: Test slide presentation layout
        run: npx playwright test --config playwright.presentation.config.ts --workers=1

      - name: Test calculation routing feedback
        run: npx playwright test --config playwright.calculation.config.ts --workers=1

      - name: Test phone media-query boundaries
        run: npx playwright test --config playwright.phone.config.ts --workers=1

      - name: Test English audit authentication gates
        run: npx playwright test --config playwright.i18n-gates.config.ts --workers=1

      - name: Test report edit restoration
        run: npx playwright test --config playwright.report-table.config.ts --workers=1

  api:
    name: API · lint, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      # Runtime dependencies too: the tests import `app.services.*`.
      - name: Install
        run: pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  scripts:
    name: Scripts · shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The only gate the hand-run integration scripts get. `error` only:
      # they pass unquoted ids and URLs by design.
      - name: shellcheck
        run: shellcheck --severity=error scripts/*.sh scripts/lib/*.sh

  image-changes:
    name: Image · detect changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      # Full history: the diff base is not in a shallow clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide what to build
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail

          build_all() {
            echo "$1"
            {
              echo 'matrix={"include":[{"name":"api","context":"apps/api"},{"name":"print","context":"apps/print"},{"name":"web","context":"apps/web"}]}'
              echo 'any=true'
            } >> "$GITHUB_OUTPUT"
          }

          if [ "$EVENT" = "workflow_dispatch" ]; then
            build_all "manual run — building all"; exit 0
          fi
          # No usable base: first commit, new branch, or force push.
          if [ -z "${BASE:-}" ] \
             || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            build_all "no diff base — building all"; exit 0
          fi

          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"; echo "$changed" | sed 's/^/  /'

          if echo "$changed" | grep -qx '.github/workflows/ci.yml'; then
            build_all "ci.yml changed — building all"; exit 0
          fi

          entries=""
          if echo "$changed" | grep -q '^apps/api/'; then
            entries='{"name":"api","context":"apps/api"}'
          fi
          if echo "$changed" | grep -q '^apps/print/'; then
            [ -n "$entries" ] && entries="$entries,"
            entries="$entries{\"name\":\"print\",\"context\":\"apps/print\"}"
          fi
          if echo "$changed" | grep -q '^apps/web/'; then
            [ -n "$entries" ] && entries="$entries,"
            entries="$entries{\"name\":\"web\",\"context\":\"apps/web\"}"
          fi

          if [ -z "$entries" ]; then
            echo "No image sources changed — nothing to build."
            { echo 'matrix={"include":[]}'; echo 'any=false'; } >> "$GITHUB_OUTPUT"
          else
            echo "Building: $entries"
            { echo "matrix={\"include\":[$entries]}"; echo 'any=true'; } >> "$GITHUB_OUTPUT"
          fi

  images:
    name: Image · build ${{ matrix.name }}
    needs: image-changes
    if: needs.image-changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.image-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # Build only; release.yml publishes. No registry credentials here, so a
      # fork's pull request cannot push an image.
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  compose:
    name: Compose · validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Interpolation and schema check. KCHAT_JWT_SECRET is required (`:?`).
      - name: Validate compose files
        env:
          KCHAT_JWT_SECRET: ci-placeholder-not-a-secret
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.build.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.build.yml \
                         -f docker-compose.dev.yml config -q
